<script>

const t=k=>(T[S.lang]&&T[S.lang][k])||T.en[k];
// ===== Scheme database (SIH-defined rules) =====
const SCH={micro:{n:"Micro Finance Scheme",rate:6.5,yrs:3,mor:3,max:125000,rng:"Project cost up to ₹1.40 lakh"},term:{n:"Term Loan Scheme",rate:8,yrs:7,mor:6,max:4500000,rng:"Project cost above ₹1.40 lakh, up to ₹50 lakh"}};
const RULES_DATE="September 2026";
// ===== Financial engine (deterministic) =====
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
function fin(c){if(!(c>0))return{err:"Please enter an amount greater than ₹0."};const cost=Math.round(c*10);
 if(cost>5e6)return{c,cost,out:1,err:"Your contribution corresponds to a project size above the financing range currently supported by this tool (₹50 lakh). Reduce the project scale or seek separate professional/institutional guidance."};
 const k=cost<=140000?"micro":"term",s=SCH[k],raw=cost*.9,loan=Math.min(raw,s.max);return{c,cost,k,s,raw,loan,capped:raw>s.max}}
const emi=(P,a,n)=>{const r=a/1200;return r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n};
function sched(P,a,y,m){const N=y*12,n=Math.max(1,N-m),e=emi(P,a,n),r=a/1200;let b=P,q=[],tp=0,ti=0;
 for(let i=1;i<=N;i++){let pay=0,it=0,pr=0;if(i>m){it=b*r;pr=e-it;pay=e;b-=pr;}tp+=pr;ti+=it;const qi=Math.floor((i-1)/3);q[qi]=q[qi]||{p:0,i:0,t:0,mo:0};q[qi].p+=pr;q[qi].i+=it;q[qi].t+=pay;if(i<=m)q[qi].mo++}
 return{e,q,total:e*n,int:e*n-P,n}}
function biz(o){const rev=o.q*o.p,vc=o.q*o.v,fx=o.rent+o.el+o.tr+o.lab+o.ot,ex=vc+fx,pf=rev-ex;return{rev,ex,pf,be:o.p>o.v?Math.ceil(fx/(o.p-o.v)):null,fx}}
// ===== Local business data (DEMO – replace with verified datasets via backend) =====
const CATS={dairy:["🐄","Dairy & Livestock"],agri:["🌾","Agriculture"],food:["🍲","Food & Processing"],retail:["🏪","Retail Shop"],tailor:["🧵","Tailoring & Textiles"],craft:["🏺","Handicrafts"],mfg:["🏭","Small Manufacturing"],repair:["🔧","Repair Services"],trans:["🚛","Transportation"],stall:["🍛","Food Stall / Small Restaurant"],poultry:["🐔","Poultry"],beauty:["💇","Beauty & Personal Care"],digital:["💻","Digital / Local Services"],other:["✨","Other"],"?":["❓","I don't know yet"]};
const D={dairy:{u:"litre milk",p:48,v:36,q:3000,rent:3000,el:2000,tr:6000,lab:8000,ot:3000,pr:[42,55],reach:"Families, tea stalls, sweet shops and nearby institutions within roughly 5–10 km.",opp:"Doorstep milk delivery and processed items (curd, ghee, paneer) may be limited in nearby villages.",S:["Daily repeat demand","Own livestock/fodder lowers cost"],W:["Animal health depends on care","Needs steady labour"],O:["Doorstep delivery","Value-added dairy products"],Th:["Milk price fluctuation","Fodder cost in dry season","Animal disease","Dependence on one buyer or dairy society"],sk:["animal","farming"],cx:"Medium"},
retail:{u:"item (avg. bill)",p:120,v:96,q:2500,rent:3000,el:1200,tr:1500,lab:0,ot:1500,pr:[100,150],reach:"Households and daily-need buyers in the village and nearby hamlets.",opp:"Items sold only in the market town may be missing nearby; a small assortment with credit-free fast service can fill this.",S:["Daily footfall","Low skill barrier"],W:["Thin margins","Stock blocked as money"],O:["Home delivery to nearby hamlets","Bundle packs"],Th:["Larger shops nearby","Customers wanting credit","Stock spoilage/expiry"],sk:["retail"],cx:"High"},
food:{u:"pack",p:60,v:38,q:1500,rent:2000,el:1500,tr:2500,lab:5000,ot:2000,pr:[45,80],reach:"Local shops, families, weekly markets and schools.",opp:"Packaged local food with hygiene labelling may be scarce in the area.",S:["Local taste knowledge","Good margins"],W:["Food-safety licence needed","Shelf life limits"],O:["Sell to shops and market days"],Th:["Raw material price swings","Seasonal demand","Quality complaints"],sk:["cooking"],cx:"Medium"},
tailor:{u:"garment",p:400,v:150,q:60,rent:2000,el:800,tr:500,lab:4000,ot:1000,pr:[300,600],reach:"Families, students, wedding-season buyers and school uniforms.",opp:"Ready alterations and fast stitching for festival season may be limited.",S:["Skill-based service","Repeat customers"],W:["Seasonal peaks","Time-limited output"],O:["School and institution orders"],Th:["Readymade clothes","Slow season","Fabric price rises"],sk:["tailoring"],cx:"Medium"},
poultry:{u:"kg bird/egg-equivalent",p:130,v:100,q:1500,rent:1500,el:1500,tr:3000,lab:4000,ot:2500,pr:[110,150],reach:"Households, dhabas, weekly markets and local traders.",opp:"Regular supply to nearby eateries may be under-served.",S:["Quick cycle of income","Steady meat/egg demand"],W:["Disease risk","Feed cost sensitivity"],O:["Direct supply to eateries"],Th:["Bird disease","Feed price","Heat and weather stress","Price swings"],sk:["animal"],cx:"Medium"},
x:{u:"unit sold",p:100,v:65,q:600,rent:2000,el:1000,tr:1500,lab:3000,ot:1500,pr:[80,130],reach:"Local households and small businesses within 5–10 km.",opp:"Check unmet needs through a short survey of 15–20 nearby households.",S:["Local presence","Owner involvement"],W:["Untested demand","Limited experience"],O:["Serve nearby villages"],Th:["Competition","Raw material access","Seasonal demand","Low purchasing power in lean months"],sk:[],cx:"Limited"}};
const dd=c=>D[c]||D.x,SK=["Farming","Cooking","Tailoring","Animal care","Repair work","Retail","Handicraft","Driving","Digital skills"],RS=["Own land","Shop space","Livestock","Equipment","Family labour","Vehicle","Customer base"];
const STATES="Andhra Pradesh,Assam,Bihar,Chhattisgarh,Gujarat,Haryana,Jharkhand,Karnataka,Kerala,Madhya Pradesh,Maharashtra,Odisha,Punjab,Rajasthan,Tamil Nadu,Telangana,Uttar Pradesh,Uttarakhand,West Bengal".split(",");
// ===== State =====
const S={v:"home",lang:"en",step:1,loc:{village:"",block:"",district:"",state:"Uttar Pradesh"},cap:100000,cat:"",sk:[],rs:[],done:0};
const $=id=>document.getElementById(id),app=$("app");
const NAV=[["home","Home"],["adv","Business Advisor"],["calc","Finance Calculator"],["gov","Government Support"],["plan","My Plan"]];
function go(v){S.v=v;$("lang").innerHTML=Object.entries(LN).map(([k,n])=>`<option value="${k}" ${k==S.lang?"selected":""}>${n}</option>`).join("");
 $("nav").innerHTML=NAV.map(([k,n])=>`<button class="${k==v?"on":""}" onclick="go('${k}')">${n}</button>`).join("");
 app.innerHTML=({home,adv,calc,gov,plan})[v]();scrollTo(0,0);after[v]&&after[v]()}
const after={};
const dis=`<div class="warn"><b>Important:</b> Loan approval, actual interest, eligibility and final financing conditions are decided by the relevant authority/channelizing agency. UdyogMinds is an indicative planning and advisory tool. All figures are estimates.</div>`;
const conf=(l,tx)=>`<span class="sm">Confidence: <b>${l}</b> — ${tx}</span>`;
const what=(t)=>`<details><summary>❓ What does this mean?</summary><p class="sm">${t}</p></details>`;
// ===== Quick calc =====
function snap(f){if(f.err&&!f.out)return`<p class="err" role="alert">${f.err}</p>`;
 if(f.out)return`<div class="warn" role="alert">⚠ ${f.err}</div><p>Contribution: <b>${inr(f.c)}</b> → calculated project size <b>${inr(f.cost)}</b>. Try a lower amount (up to ₹5,00,000).</p>`;
 return`<div class="grid"><div><div class="sm">Your contribution (10%)</div><div class="big">${inr(f.c)}</div></div><div><div class="sm">Possible project size</div><div class="big">${inr(f.cost)}</div></div><div><div class="sm">Loan support you may need</div><div class="big">${inr(f.loan)}</div></div><div><div class="sm">Applicable scheme</div><div class="big" style="font-size:22px">${f.s.n}</div></div></div>${f.capped?`<div class="warn">⚠ 90% of the project (${inr(f.raw)}) is above the scheme ceiling, so indicative loan is capped at ${inr(f.s.max)}.</div>`:""}`}
function ratio(f){if(!f.loan)return"";const l=f.loan/f.cost*100;return`<div class="bar" role="img" aria-label="${(100-l).toFixed(0)} percent your money, ${l.toFixed(0)} percent loan"><i style="width:${100-l}%;background:var(--am);color:#222">${(100-l).toFixed(0)}% YOU</i><i style="width:${l}%;background:var(--g)">${l.toFixed(0)}% LOAN</i></div>`}
function home(){return`<section class="card" style="background:var(--sg)"><h1>${t("h")}</h1><p>${t("s")}</p><div class="chips"><button class="btn" onclick="S.step=1;go('adv')">${t("c1")}</button><button class="btn alt" onclick="go('calc')">${t("c2")}</button></div><p style="font-size:44px;margin:8px 0" aria-hidden="true">🏡 → 🐄🏪 → 💰 → 🌱</p></section>
<section class="card"><h2 style="margin-top:0">How much business can your savings support?</h2><label for="qc">Your savings (₹)</label><input id="qc" type="number" inputmode="numeric" min="1" value="10000" oninput="$('qo').innerHTML=snap(fin(+this.value))"><div class="chips" style="margin:8px 0">${[10000,50000,100000].map(v=>`<button class="chip" onclick="$('qc').value=${v};$('qc').oninput()">${inr(v)}</button>`).join("")}</div><div id="qo">${snap(fin(10000))}</div><button class="btn" onclick="S.cap=+$('qc').value||10000;S.step=1;go('adv')">Build My Full Plan</button></section>
<section class="card"><h2 style="margin-top:0">Try an example</h2><p class="sm">Different places, businesses and amounts give different schemes and local results.</p><div class="chips">${EX.map((e,i)=>`<button class="chip" onclick="ex(${i})">${CATS[e.k][0]} ${e.d} · ${inr(e.c)}</button>`).join("")}</div></section><section class="card"><h2 style="margin-top:0">How UdyogMinds works</h2><ol><li>We analyze your inputs</li><li>We calculate financing using defined scheme rules</li><li>We check available local/regional data</li><li>We prepare a business feasibility report</li><li>We explain risks and assumptions</li></ol></section>${dis}`}
// ===== Advisor wizard =====
function adv(){if(S.done&&S.cat&&S.cat!="?")return result();const f=fin(S.cap);const st=`<div class="step" aria-label="Step ${S.step} of 4">${[1,2,3,4].map(i=>`<i class="${i<=S.step?"on":""}"></i>`).join("")}</div><p class="sm">Step ${S.step} of 4</p>`;let b="";
 if(S.step==1)b=`<h2>Where do you want to start your business?</h2>${["village:Village","block:Block","district:District"].map(x=>{const[k,n]=x.split(":");return`<label for="l${k}">${n}</label><input id="l${k}" ${k=="district"?'list="dl"':""} value="${S.loc[k]}" oninput="S.loc.${k}=this.value">`}).join("")}<datalist id="dl">${(DIST[S.loc.state]||[]).map(x=>`<option>${x}`).join("")}</datalist><label for="lstate">State</label><select id="lstate" onchange="S.loc.state=this.value;go('adv')">${STATES.map(s=>`<option ${s==S.loc.state?"selected":""}>${s}</option>`).join("")}</select><button class="chip" style="margin-top:10px" onclick="geo()">📍 Use my location</button><p id="ge" class="sm"></p>`;
 if(S.step==2)b=`<h2>How much money do you currently have to invest?</h2><label for="cp">₹ Your own contribution</label><input id="cp" type="number" inputmode="numeric" value="${S.cap}" oninput="S.cap=+this.value;$('cv').innerHTML=snap(fin(S.cap))"><div class="chips" style="margin:8px 0">${[10000,25000,50000,100000,200000,500000].map(v=>`<button class="chip" onclick="S.cap=${v};$('cp').value=${v};$('cv').innerHTML=snap(fin(${v}))">${inr(v)}</button>`).join("")}</div><p class="sm">This is your own contribution. The financing model treats it as 10% of the project cost.</p><div id="cv" class="card">${snap(f)}</div>`;
 if(S.step==3)b=`<h2>What type of business are you interested in?</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${Object.entries(CATS).map(([k,[e,n]])=>`<button class="cat ${S.cat==k?"on":""}" onclick="S.cat='${k}';go('adv')"><span>${e}</span>${n}</button>`).join("")}</div>`;
 if(S.step==4)b=`<h2>Tell us a little more (optional)</h2><label>Your skills</label><div class="chips">${SK.map(x=>`<button class="chip ${S.sk.includes(x)?"on":""}" onclick="tg(S.sk,'${x}',this)">${x}</button>`).join("")}</div><label>Resources you already have</label><div class="chips">${RS.map(x=>`<button class="chip ${S.rs.includes(x)?"on":""}" onclick="tg(S.rs,'${x}',this)">${x}</button>`).join("")}</div>`;
 return`<h1 style="font-size:30px">Business Advisor</h1>${st}<div class="card">${b}<p id="er" class="err" role="alert"></p><div class="chips" style="margin-top:12px">${S.step>1?`<button class="btn alt" onclick="S.step--;go('adv')">Back</button>`:""}<button class="btn" onclick="nx()">${S.step<4?"Next":"Generate My Business Plan"}</button></div></div>`}
function tg(a,x,el){const i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);el.classList.toggle("on")}

function nx(){const e=$("er");let m="";
 if(S.step==1&&(!S.loc.district.trim()||!S.loc.state))m="Please select at least your district and state.";
 if(S.step==2){const f=fin(S.cap);if(f.err)m=f.err}
 if(S.step==3&&!S.cat)m="Choose a business category or select 'I don't know yet'.";
 if(m){e.textContent=m;return}
 if(S.step<4){S.step++;return go("adv")}
 app.innerHTML=`<div class="card"><p id="ld">Understanding your local market…</p></div>`;const L=["Checking financial feasibility…","Finding suitable financing structure…","Preparing your business plan…"];let i=0;const iv=setInterval(()=>{if(i<3)$("ld").textContent=L[i++];else{clearInterval(iv);S.done=1;go(S.cat=="?"?"adv":"plan")}},350)}

 const pop=Math.round((22000+r()*68000)/500)*500,hh=Math.round(pop/51)*10,dem=Math.round(45+r()*45),nc=Math.round(2+r()*(S.cat=="retail"?24:S.cat=="dairy"?12:14)),dens=nc/pop*1e4,lvl=dens<2.5?"Low":dens<5?"Medium":"High";
 const sea=(SEAS[S.cat]||Array(12).fill(1)).map(x=>+(x*(.95+r()*.1)).toFixed(2)),mx=Math.max(...sea),mi=Math.min(...sea),pk=MN[sea.indexOf(mx)],ln=MN[sea.indexOf(mi)];
 const p=Math.round(d.p*pi*(.97+r()*.06)),v=Math.round(d.v*(.97+r()*.06)),dirs=["north","east","south","west","north-east","south-west"],dir=dirs[Math.floor(r()*6)];

 const svg=`<svg viewBox="0 0 200 200" role="img" aria-label="Estimated competitor density within 10 km: ${lvl}" style="max-width:220px;width:100%"><circle cx="100" cy="100" r="90" fill="none" stroke="#999" stroke-dasharray="4"/><circle cx="100" cy="100" r="45" fill="none" stroke="#999" stroke-dasharray="4"/>${dots}<circle cx="100" cy="100" r="7" fill="#1f5a3a"/><text x="100" y="118" font-size="11" text-anchor="middle" fill="currentColor">You</text><text x="150" y="98" font-size="9" fill="currentColor">5 km</text><text x="160" y="20" font-size="9" fill="currentColor">10 km</text></svg>`;
 const bars=`<div style="display:flex;align-items:flex-end;gap:3px;height:70px">${sea.map((x,i)=>`<div title="${MN[i]} ${x}" style="flex:1;height:${x*45}px;background:${x>=1.1?"var(--g)":x<.9?"var(--am)":"var(--ln)"}"></div>`).join("")}</div><div style="display:flex;gap:3px;font-size:11px">${MN.map(m=>`<span style="flex:1;text-align:center">${m[0]}</span>`).join("")}</div>`;
 const th=[];if(lvl=="High")th.push(`Crowded market: about ${nc} similar units within 10 km`);if(pi<.85)th.push("Lower local purchasing power — customers may be price-sensitive");th.push(`Lean season around ${ln}: demand about ${Math.round((1-mi)*100)}% below average`);if(dem<60)th.push("Demand indicators for this area are modest — validate before scaling");
 const sc=f.cost<=300000?"a small":f.cost<=1500000?"a medium":"an expanded";

 I={pop,hh,dem,nc,dens,lvl,sea:bars,svg,pk,ln,p,v,lo:Math.round(p*.88),hi:Math.round(p*1.12),pi:pi.toFixed(2),gap:gap+" (mostly "+dir+" side)",ch:chs,cf,cl,th:th.concat(d.Th),nar,basis:vb?"Village-level cues combined with block/district indicators.":"Village not given — block/district indicators used.",

 ml:[["Demand model (gradient-boosted trees)","score "+dem+"/100",Math.min(92,cf+4)],["Competitor density estimator","~"+nc+" units / 10 km",cf],["Price-index model",inr(Math.round(p*.88))+"–"+inr(Math.round(p*1.12)),Math.min(90,cf+2)],["Seasonality model","peak "+pk,cf-3]]}}

 intel(f,d);const sc=Math.min(2,Math.max(.3,f.cost/1e6)),q0=Math.round(d.q*sc*I.dem/70/10)*10||1;SIM={q:q0,p:I.p,v:I.v,rent:d.rent,el:d.el,tr:d.tr,lab:d.lab,ot:d.ot};EM={P:f.loan,a:f.s.rate,y:f.s.yrs,m:f.s.mor};
 const scale=f.cost<=300000?"Small":f.cost<=1500000?"Medium":"Expanded";
